# Copy to applier/profiles/<name>.yaml (gitignored) and fill in. Only `facts` may be
# used to answer form questions — keep it true; the agent never invents beyond it.
name: example
browser_profile_dir: ~/.config/jobdoot-applier   # Chromium profile logged into LinkedIn
resume_pdf: ~/job-doot/data/applier/example_resume.pdf   # data/ is shared with the main checkout
pick_jobs_from_user_id: 1      # whose job scores decide which jobs to apply to
min_score: 7
max_per_slot: 2
slots_per_day: [6, 8]
active_hours: [10, 20]
models: {primary: haiku, retry: sonnet}
offsite: true                  # Phase 2: also apply on company sites (Apply ↗)
include_offsite: true          # let the job query return company-site jobs
source: db                     # db (score rule) | linkedin_search (test mode, see spec)
# search_keywords: ["AI Engineer", "Machine Learning Engineer"]
# search_location: India
facts: |
  Name: ...
  Email: ...
  Phone: ... (country code +91)
  Location: ...
  Education: ...
  Skills: ...
  Work experience: none
  Notice period: ...
  Expected salary/stipend: ...
  Willing to relocate: ...
  Citizenship / work authorization: ...
